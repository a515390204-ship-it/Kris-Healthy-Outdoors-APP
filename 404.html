<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>页面未找到 | 松弛实验室</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f2e9;
      --text: #1d2b21;
      --muted: #687466;
      --panel: rgba(255, 251, 245, 0.88);
      --line: rgba(29, 43, 33, 0.1);
      --shadow: 0 24px 60px rgba(35, 48, 37, 0.12);
      --green: #2d7a5e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Outfit", "Segoe UI", sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, #faf4ea 0%, #edf5ef 100%);
    }

    .card {
      width: min(680px, 100%);
      padding: 32px;
      border-radius: 30px;
      border: 1px solid var(--line);
      background: var(--panel);
      box-shadow: var(--shadow);
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--green);
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-size: 0.82rem;
    }

    h1 {
      margin: 0;
      font-family: "Noto Serif SC", serif;
      font-size: clamp(2rem, 5vw, 3.5rem);
    }

    p {
      margin: 16px auto 0;
      max-width: 36rem;
      color: var(--muted);
      line-height: 1.72;
    }

    a {
      display: inline-flex;
      margin-top: 24px;
      padding: 12px 18px;
      border-radius: 999px;
      background: #214d40;
      color: #fffaf2;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">404</p>
    <h1>这个页面不对外开放</h1>
    <p>你访问的内容当前没有公开发布。如果你是从站内跳转过来的，可以返回首页继续浏览公开页面。</p>
    <a href="index.html">返回首页</a>
  </main>
</body>
</html>
